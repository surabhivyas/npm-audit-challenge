name: NPM Audit Challenge

on:
  push:

jobs:
  audit:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run NPM Audit Action
        id: npm_audit
        uses: oke-py/npm-audit-action@v5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          json_flag: true
          fail_on_vulnerabilities: false
          create_issues: false
          create_pr_comments: false

      - name: Save audit output
        env:
          NPM_AUDIT_OUTPUT: ${{ steps.npm_audit.outputs.npm_audit }}
        run: |
          printf '%s\n' "$NPM_AUDIT_OUTPUT" > results.json

      - name: Validate generated report
        run: |
          echo "Checking generated report..."
          ls -lh results.json

          node -e "
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('results.json', 'utf8'));

          console.log('Valid JSON');
          console.log('Top-level keys:', Object.keys(r));
          console.log('auditReportVersion:', r.auditReportVersion);
          console.log(
            'vulnerabilities:',
            Object.keys(r.vulnerabilities || {}).length
          );
          console.log(JSON.stringify(r.metadata, null, 2));
          "

      - name: Send report to AppSecEngineer listener
        run: |
          curl -v \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @results.json \
            http://35.219.140.99:8880/callback
