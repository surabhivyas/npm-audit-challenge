name: NPM Audit Challenge
on:
  push:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit --json > audit-report.json
        continue-on-error: true

      - name: Verify report exists
        run: |
          echo "File size:"
          ls -lh audit-report.json
          echo "First 20 lines:"
          head -n 20 audit-report.json

      - name: Send report
        run: |
          curl -X POST -H "Content-Type: application/json" \
            --data-binary @audit-report.json \
            http://35.219.147.98:8880/callback
