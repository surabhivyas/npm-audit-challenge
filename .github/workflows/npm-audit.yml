name: NPM Audit Scan

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  npm-audit-scan-job:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.16.1'

      - name: Install dependencies
        run: npm install

      - name: NPM Audit Scan
        run: npm audit --json > npm-audit-results.json
        continue-on-error: true

      - name: Verify report
        run: |
          ls -lh npm-audit-results.json
          node -e "
          const r = require('./npm-audit-results.json');
          console.log('auditReportVersion:', r.auditReportVersion);
          console.log('vulnerabilities:', Object.keys(r.vulnerabilities || {}).length);
          console.log(JSON.stringify(r.metadata, null, 2));
          "

      - name: Send report
        run: |
          curl -v \
            -X POST \
            -H "Content-Type: multipart/form-data" \
            -F "file=@npm-audit-results.json" \
            http://35.219.140.99:8880/callback
