name: NPM Audit Challenge

on:
  push:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit --json > results.json || true

      - name: Validate generated JSON
        run: |
          echo "Checking results.json..."
          ls -lh results.json

          node -e "
          const fs = require('fs');
          const data = fs.readFileSync('results.json', 'utf8');
          const report = JSON.parse(data);

          console.log('Valid JSON');
          console.log('auditReportVersion:', report.auditReportVersion);
          console.log('vulnerabilities:', Object.keys(report.vulnerabilities || {}).length);
          console.log('metadata:', report.metadata);
          "

      - name: Send audit report to challenge listener
        run: |
          curl --fail-with-body -v \
            -X POST \
            -F "file=@results.json;type=application/json" \
            http://35.219.140.99:8880/callback
