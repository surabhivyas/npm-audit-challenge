name: NPM Audit Challenge
on:
  push:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit --json > results.json
        continue-on-error: true

      - name: Verify report exists
        run: |
          echo "File size:"
          ls -lh results.json
          echo "First 20 lines:"
          head -n 20 results.json

      - name: Send report
        run: |
          curl -X POST -H "Content-Type: application/json" \
            --data-binary @results.json \
            http://35.219.190.69:8880/callback
